name: Genesis Quality Gate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  genesis-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gov:verify
      - run: pnpm run build
