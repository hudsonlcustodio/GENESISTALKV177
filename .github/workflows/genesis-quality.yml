name: Genesis Quality Gate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  genesis-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Full type coverage includes the test suite; local 4 GiB heap exhausted.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      - run: pnpm run gov:verify
      - run: pnpm run build
